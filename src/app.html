		<!-- Global Brand Styles -->
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: 'Inter', system-ui, -apple-system, sans-serif;
				background-color: #EEF2EE; /* Mint Grey */
				color: #303B38; /* Slate Graphite */
				-webkit-font-smoothing: antialiased;
			}

			h1, h2, h3, h4, h5, h6 { 
				color: #303B38; 
				font-weight: 700; 
				font-family: 'Manrope', sans-serif;
				letter-spacing: -0.02em; 
			}
			
			p { 
				color: #4b5563; 
				line-height: 1.6; 
			}

			/* Global Card Style */
			.card {
				background: #FFFFFF;
				border: 1px solid #d1d5db;
				border-radius: 16px;
				padding: 32px;
				box-shadow: 0 4px 6px rgba(0,0,0,0.02);
			}

			/* Global Buttons */
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				padding: 10px 20px;
				border-radius: 8px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				border: none;
				transition: all 0.2s ease;
				font-family: 'Inter', sans-serif;
			}
			.btn-primary {
				background-color: #24503C; /* Forest Green */
				color: #FFFFFF;
			}
			.btn-primary:hover { background-color: #1a3a2b; }
			
			.btn-secondary {
				background-color: #FFFFFF;
				color: #303B38;
				border: 1px solid #d1d5db;
			}
			.btn-secondary:hover { background-color: #F3F4F6; }

			/* Global Inputs */
			.input-field {
				width: 100%;
				padding: 12px 16px;
				border: 1px solid #d1d5db;
				border-radius: 8px;
				font-size: 14px;
				color: #303B38;
				background-color: #FFFFFF;
				outline: none;
				transition: all 0.2s ease;
				font-family: 'Inter', sans-serif;
			}
			.input-field:focus {
				border-color: #24503C;
				box-shadow: 0 0 0 3px rgba(36, 80, 60, 0.1);
			}

			.input-label {
				display: block;
				font-size: 13px;
				font-weight: 600;
				color: #303B38;
				margin-bottom: 6px;
				font-family: 'Inter', sans-serif;
			}

			/* Print Styles for PDF Generation */
			@media print {
				body * { visibility: hidden; }
				#pdf-template, #pdf-template * { visibility: visible; }
				#pdf-template { 
					display: block !important; 
					position: absolute; 
					left: 0; 
					top: 0; 
					width: 100%; 
					margin: 0;
					padding: 40px;
				}
			}
		</style>
